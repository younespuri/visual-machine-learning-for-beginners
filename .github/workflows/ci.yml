name: notebooks

# Runs every lesson's code from a clean machine, so the course never ships
# a lesson whose code doesn't work.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run every lesson notebook
        run: python tools/build_notebooks.py --verify
